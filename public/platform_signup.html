<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARIS Platform - Crează consultant bot digital</title>
<link rel="stylesheet" href="platform.css">
<style>
  :root{
    --primary:#667eea; --primary-dark:#764ba2;
    --bg:#f4f2ec; --surface:#ffffff;
    --ink:#132e26;
  }
  body{ margin:0; padding:0; font-family:Arial, sans-serif; background:var(--bg); }
  .container{ max-width:500px; margin:40px auto; padding:20px; }
  .card{ background:var(--surface); border-radius:12px; padding:30px; box-shadow:0 2px 8px rgba(0,0,0,0.1); }
  h1{ color:var(--ink); margin:0 0 10px 0; }
  .step-indicator{ color:#999; font-size:14px; margin-bottom:20px; }

  .form-group{ margin-bottom:15px; }
  label{ display:block; margin-bottom:5px; color:var(--ink); font-weight:bold; font-size:14px; }
  input, select{ width:100%; padding:12px; border:1px solid #ddd; border-radius:6px; font-size:14px; box-sizing:border-box; }
  input:focus, select:focus{ outline:none; border-color:var(--primary); box-shadow:0 0 0 3px rgba(102,126,234,0.1); }

  .pricing-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:20px; }
  .plan-card{
    padding:15px; border:2px solid #ddd; border-radius:8px; cursor:pointer; transition:all 0.3s;
    text-align:center;
  }
  .plan-card:hover{ border-color:var(--primary); }
  .plan-card.selected{
    border-color:var(--primary); background:rgba(102,126,234,0.05);
  }
  .plan-card h3{ margin:0; color:var(--ink); font-size:16px; }
  .plan-card .price{ color:var(--primary); font-weight:bold; font-size:18px; margin:5px 0; }
  .plan-card .desc{ color:#999; font-size:12px; }

  .btn{
    width:100%; padding:12px; border:none; border-radius:6px; font-weight:bold;
    cursor:pointer; transition:all 0.3s; font-size:16px;
  }
  .btn-primary{
    background:linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color:#fff;
  }
  .btn-primary:hover{ transform:translateY(-2px); box-shadow:0 8px 16px rgba(102,126,234,0.3); }
  .btn-primary:disabled{ opacity:0.6; cursor:not-allowed; }

  .loading{ text-align:center; color:#999; }
  .error{ color:#d32f2f; padding:12px; background:#ffebee; border-radius:6px; margin-bottom:15px; }

  @media (max-width:600px){
    .container{ margin:20px auto; }
    .pricing-grid{ grid-template-columns:1fr; }
  }
</style>
</head>
<body>

<div class="container">
  <div class="card">
    <h1>🤖 Crează consultant bot digital</h1>
    <p class="step-indicator">Pasul <span id="currentStep">1</span> din 2</p>

    <div id="error" class="error" style="display:none;"></div>

    <!-- Step 1: Firm Info -->
    <div id="step1" style="display:block;">
      <div class="form-group">
        <label for="firmName">Numele companiei</label>
        <input type="text" id="firmName" placeholder="Ex: Firma de Consultanță SRL">
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="contact@firma.ro">
      </div>
      <div class="form-group">
        <label for="country">Țara</label>
        <select id="country">
          <option value="RO">România</option>
          <option value="DE">Germania</option>
          <option value="PL">Polonia</option>
          <option value="CZ">Cehia</option>
          <option value="SK">Slovacia</option>
          <option value="HU">Ungaria</option>
          <option value="SI">Slovenia</option>
        </select>
      </div>
      <button class="btn btn-primary" onclick="goToStep2()">Urmează → Alege plan</button>
    </div>

    <!-- Step 2: Plan Selection -->
    <div id="step2" style="display:none;">
      <p style="color:#666; margin-bottom:15px;">Selectează plan și plătește. Boțul tău va fi activ imediat.</p>

      <div class="pricing-grid" id="plans">
        <div class="plan-card" onclick="selectPlan('solo')" data-plan="solo">
          <h3>SOLO</h3>
          <div class="price">€99/lună</div>
          <div class="desc">1 bot<br>2 servicii</div>
        </div>
        <div class="plan-card selected" onclick="selectPlan('pro')" data-plan="pro">
          <h3>PRO</h3>
          <div class="price">€349/lună</div>
          <div class="desc">3 boți<br>5 servicii</div>
        </div>
      </div>

      <div style="margin-top:20px; padding:15px; background:#f5f5f5; border-radius:6px; text-align:center;">
        <p style="margin:0; font-size:14px; color:#666;">ENTERPRISE (€999/lună)</p>
        <p style="margin:5px 0 0 0; font-size:12px; color:#999;">Contactează-ne pentru optiuni personalizate</p>
      </div>

      <button id="payBtn" class="btn btn-primary" style="margin-top:20px;" onclick="processPayment()">Mergi la plată</button>
      <button class="btn" style="background:#f0f0f0; color:#333; margin-top:10px;" onclick="goToStep1()">← Înapoi</button>
    </div>

    <!-- Loading -->
    <div id="loading" style="display:none;">
      <div class="loading">
        <p>Se procesează...</p>
      </div>
    </div>
  </div>
</div>

<script>
  const API_URL = window.location.hostname === 'localhost'
    ? 'http://localhost:3000'
    : 'https://aris-platform.com';

  let currentPlan = 'pro';

  function goToStep2() {
    const firmName = document.getElementById('firmName').value;
    const email = document.getElementById('email').value;

    if (!firmName || !email) {
      showError('Completează toate câmpurile');
      return;
    }

    if (!email.includes('@')) {
      showError('Email invalid');
      return;
    }

    document.getElementById('step1').style.display = 'none';
    document.getElementById('step2').style.display = 'block';
    document.getElementById('currentStep').textContent = '2';
  }

  function goToStep1() {
    document.getElementById('step2').style.display = 'none';
    document.getElementById('step1').style.display = 'block';
    document.getElementById('currentStep').textContent = '1';
  }

  function selectPlan(plan) {
    currentPlan = plan;
    document.querySelectorAll('.plan-card').forEach(el => {
      el.classList.remove('selected');
    });
    document.querySelector(`[data-plan="${plan}"]`).classList.add('selected');
  }

  async function processPayment() {
    const firmName = document.getElementById('firmName').value;
    const email = document.getElementById('email').value;
    const country = document.getElementById('country').value;

    if (!firmName || !email) {
      showError('Completează toate câmpurile');
      return;
    }

    document.getElementById('payBtn').disabled = true;
    document.getElementById('loading').style.display = 'block';

    try {
      const response = await fetch(`${API_URL}/api/firm/signup`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          firmName,
          email,
          country,
          planId: currentPlan
        })
      });

      const data = await response.json();

      if (data.checkoutUrl) {
        window.location.href = data.checkoutUrl;
      } else {
        showError(data.error || 'Eroare la procesare');
      }
    } catch (err) {
      showError('Eroare de rețea: ' + err.message);
    } finally {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('payBtn').disabled = false;
    }
  }

  function showError(msg) {
    const errorEl = document.getElementById('error');
    errorEl.textContent = msg;
    errorEl.style.display = 'block';
    setTimeout(() => {
      errorEl.style.display = 'none';
    }, 5000);
  }
</script>

</body>
</html>
