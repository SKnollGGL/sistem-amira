<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800">
<defs>
  <filter id="mapglow"><feGaussianBlur stdDeviation="1.5"/></filter>
</defs>
<!-- Continents as clear visible shapes -->
<g fill="rgba(255,255,255,0.85)" stroke="rgba(255,255,255,0.75)" stroke-width="2" filter="url(#mapglow)">
  <!-- North America -->
  <polygon points="150,200 250,180 280,280 200,300 140,260"/>
  <!-- South America -->
  <polygon points="200,350 280,340 290,500 210,480"/>
  <!-- Europe/Africa -->
  <polygon points="450,180 550,160 580,400 480,420"/>
  <!-- Asia -->
  <polygon points="600,150 800,140 850,350 700,380"/>
  <!-- Australia -->
  <polygon points="850,450 920,440 930,520 870,510"/>
</g>
<!-- Map grid lines for reference -->
<g stroke="rgba(255,255,255,0.25)" stroke-width="1" opacity="0.6">
  <line x1="300" y1="0" x2="300" y2="800"/>
  <line x1="600" y1="0" x2="600" y2="800"/>
  <line x1="900" y1="0" x2="900" y2="800"/>
  <line x1="0" y1="200" x2="1200" y2="200"/>
  <line x1="0" y1="400" x2="1200" y2="400"/>
  <line x1="0" y1="600" x2="1200" y2="600"/>
</g>
</svg>
