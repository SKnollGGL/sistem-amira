<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100">
<!-- STEP 1: Chat/Message Icon -->
<g id="step1">
  <circle cx="50" cy="50" r="40" fill="#0a9d67" opacity="0.1"/>
  <path d="M 35 35 L 65 35 L 65 55 L 50 65 L 50 55 L 35 55 Z" fill="#0a9d67" stroke="#0a9d67" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="42" cy="45" r="2" fill="#0a9d67"/>
  <circle cx="50" cy="45" r="2" fill="#0a9d67"/>
  <circle cx="58" cy="45" r="2" fill="#0a9d67"/>
</g>

<!-- STEP 2: Lightbulb/Consultant Icon -->
<g id="step2" transform="translate(100, 0)">
  <circle cx="50" cy="50" r="40" fill="#0a9d67" opacity="0.1"/>
  <ellipse cx="50" cy="35" rx="12" ry="15" fill="#0a9d67"/>
  <path d="M 40 50 Q 40 58 45 60 L 45 65 L 55 65 L 55 60 Q 60 58 60 50" fill="#0a9d67" stroke="#0a9d67" stroke-width="2"/>
  <line x1="45" y1="65" x2="55" y2="65" stroke="#0a9d67" stroke-width="2"/>
</g>

<!-- STEP 3: Target/Checklist Icon -->
<g id="step3" transform="translate(200, 0)">
  <circle cx="50" cy="50" r="40" fill="#0a9d67" opacity="0.1"/>
  <circle cx="45" cy="45" r="12" fill="none" stroke="#0a9d67" stroke-width="2"/>
  <circle cx="45" cy="45" r="8" fill="none" stroke="#0a9d67" stroke-width="2"/>
  <circle cx="45" cy="45" r="4" fill="#0a9d67"/>
  <path d="M 58 35 L 65 42 L 58 50 Z" fill="#0a9d67"/>
  <path d="M 60 60 L 65 60 M 60 68 L 65 68" stroke="#0a9d67" stroke-width="2" stroke-linecap="round"/>
</g>

<!-- STEP 4: Puzzle/Gears Icon -->
<g id="step4" transform="translate(300, 0)">
  <circle cx="50" cy="50" r="40" fill="#0a9d67" opacity="0.1"/>
  <circle cx="42" cy="42" r="10" fill="#0a9d67"/>
  <circle cx="42" cy="42" r="5" fill="white"/>
  <circle cx="58" cy="58" r="10" fill="#0a9d67"/>
  <circle cx="58" cy="58" r="5" fill="white"/>
  <path d="M 52 42 L 58 48" stroke="#0a9d67" stroke-width="2"/>
  <polygon points="65,45 70,40 72,52" fill="#0a9d67"/>
  <polygon points="35,65 30,70 38,75" fill="#0a9d67"/>
</g>
</svg>
